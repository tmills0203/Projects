<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />
    <title>khan academy</title>
  </head>
  <body>
    <nav id="nav">
      <div class="menuSearch">
        <select name="course" id="course">
          <option value="math">Courses</option>
        </select>
        <input type="search" placeholder="search" />
      </div>

      <img src="#" alt="Khan Academy" />

      <ul>
        <li>Donate</li>
        <li>Login</li>
        <li>Sign up</li>
      </ul>
    </nav>

    <main id="main">
      <section class="leftSide">
        <img
          src="img/Vibrant Student Learning Collage.png"
          alt="kids studying"
        />
      </section>
      <section class="rightSide">
        <h1>For every sudent, every classroom. Real results.</h1>
        <p>
          we're nonprofit with the mission to provide a free, world-class
          education for anyone, anywhere.
        </p>
        <div class="rightSideBtn">
          <button>Learners</button>
          <button>Teachers</button>
          <button>Districts</button>
          <button>Parents</button>
        </div>
      </section>
    </main>
